[project]
name = "Sammie-Roto-2"
version = "2.5.0"
description = "Sammie Roto 2 application"
requires-python = ">=3.12,<3.13"

dependencies = [
    "opencv-python~=4.14",
    "PySide6-essentials==6.9.3",
    "av~=18.1",
    "requests~=2.34",
    "tqdm~=4.70",
    "OpenEXR~=3.4",
    "diffusers~=0.39",
    "einops~=0.8",
    "accelerate~=1.14",
]

[project.optional-dependencies]
macos = ["torch==2.14.0 ; sys_platform == 'darwin'", "torchvision==0.29.0 ; sys_platform == 'darwin'"]
cpu   = ["torch==2.11.0", "torchvision==0.26.0"]
cu126 = ["torch==2.11.0", "torchvision==0.26.0"]
cu130 = ["torch==2.11.0", "torchvision==0.26.0"]
xpu   = ["torch==2.11.0", "torchvision==0.26.0", "triton-xpu==3.7.0"]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "macos" },
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu130" },
    { extra = "xpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-xpu",   extra = "xpu" },
  { index = "pytorch-cpu",   extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-xpu",   extra = "xpu" },
  { index = "pytorch-cpu",   extra = "cpu" },
]
triton-xpu = [
  { index = "pytorch-xpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true