name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate tag and build package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi

          mkdir -p dist
          archive="Sammie-Roto-2-${version}.zip"
          git archive \
            --format=zip \
            --prefix="Sammie-Roto-2-${version}/" \
            --output="dist/${archive}" \
            HEAD
          cd dist
          sha256sum "$archive" > "${archive}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Sammie-Roto-2-*.zip \
            dist/Sammie-Roto-2-*.zip.sha256 \
            --verify-tag \
            --title "Sammie-Roto ${GITHUB_REF_NAME#v}" \
            --generate-notes
